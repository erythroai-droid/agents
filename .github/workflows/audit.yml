name: Website QA Auditor

on:
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
          cache-dependency-path: 'QA_Auditor/pom.xml'

      - name: Install Playwright Browsers & OS Dependencies
        run: |
          npx playwright install --with-deps

      - name: Run QA Audit Collector
        working-directory: QA_Auditor
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          mvn compile exec:java

      - name: Upload Audit Reports as Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-reports
          path: |
            QA_Auditor/reports/audit_data.json
            QA_Auditor/reports/audit-report.md
            QA_Auditor/reports/audit-report.pdf
