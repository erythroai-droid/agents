name: Website QA Auditor

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: 'URL целевого сайта для аудита'
        required: true
        default: 'https://erythro.ai/'
        type: string
      locales:
        description: 'Список локалей через запятую (например: en,ru,he или ru)'
        required: false
        default: 'en,ru,he'
        type: string

jobs:
  audit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
          cache-dependency-path: 'QA_Auditor/pom.xml'

      - name: Install Playwright Browsers & OS Dependencies
        run: |
          npx playwright install --with-deps

      - name: Clean previous reports
        run: rm -rf QA_Auditor/reports/*

      - name: Run QA Audit Collector
        working-directory: QA_Auditor
        env:
          TARGET_URL: ${{ inputs.target_url }}
          LOCALES: ${{ inputs.locales }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PAGESPEED_API_KEY: ${{ secrets.PAGESPEED_API_KEY }}
        run: |
          mvn compile exec:java

      - name: Upload Audit Reports as Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-reports
          path: |
            QA_Auditor/reports/audit_data.json
            QA_Auditor/reports/audit-report.md
            QA_Auditor/reports/audit-report.pdf
